<!-- file_path: frontend/templates/auth/register.html -->

{% extends "layouts/base.html" %}

{% block title %}ثبت‌نام | صدرافارس{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-auth p-5">
    <div class="bg-white rounded-3xl p-8 md:p-10 max-w-lg w-full shadow-soft">
        <h1 class="text-3xl md:text-4xl font-bold text-center text-gray-900 mb-2">📝 ثبت‌نام</h1>
        <p class="text-center text-gray-500 text-sm mb-8">ایجاد حساب کاربری جدید در صدرافارس</p>
        
        <div id="errorMessage" class="bg-red-100 text-red-700 p-3 rounded-xl text-sm mb-5 hidden"></div>
        <div id="successMessage" class="bg-green-100 text-green-700 p-3 rounded-xl text-sm mb-5 hidden"></div>
        
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">نام کامل</label>
                <input type="text" id="fullName" placeholder="نام و نام خانوادگی" required
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-400 focus:ring-4 focus:ring-teal-100 outline-none transition-all bg-gray-50 focus:bg-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">نام کاربری</label>
                <input type="text" id="username" placeholder="username" required
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-400 focus:ring-4 focus:ring-teal-100 outline-none transition-all bg-gray-50 focus:bg-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">ایمیل</label>
                <input type="email" id="email" placeholder="example@email.com" required
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-400 focus:ring-4 focus:ring-teal-100 outline-none transition-all bg-gray-50 focus:bg-white">
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">رمز عبور</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6"
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-400 focus:ring-4 focus:ring-teal-100 outline-none transition-all bg-gray-50 focus:bg-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">تکرار رمز</label>
                    <input type="password" id="passwordConfirm" placeholder="••••••••" required
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-400 focus:ring-4 focus:ring-teal-100 outline-none transition-all bg-gray-50 focus:bg-white">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">شماره تماس (اختیاری)</label>
                <input type="text" id="phone" placeholder="0912 345 6789"
                    class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-teal-400 focus:ring-4 focus:ring-teal-100 outline-none transition-all bg-gray-50 focus:bg-white">
            </div>
            <button type="submit" class="btn-primary">🚀 ثبت‌نام</button>
        </form>
        
        <div class="text-center mt-5 text-sm text-gray-500">
            قبلاً ثبت‌نام کرده‌اید؟ <a href="/login" class="text-teal-600 font-semibold hover:underline">وارد شوید</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/pages/register.js?v={{ timestamp }}"></script>
{% endblock %}
