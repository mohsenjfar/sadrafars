<!-- file_path: frontend/templates/dashboard.html -->

{% extends "layouts/base.html" %}

{% block title %}داشبورد کاربری | صدرافارس{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-70px)] flex items-center justify-center bg-auth p-5">
    <div class="bg-white rounded-3xl p-8 md:p-10 max-w-md w-full shadow-soft text-center">
        
        <!-- آواتار -->
        <div class="user-avatar-large mb-5" id="userAvatar">👤</div>
        
        <h1 class="text-2xl font-bold text-gray-900" id="userName">کاربر</h1>
        <p class="text-gray-500 text-sm mb-5" id="userEmail">example@email.com</p>
        
        <!-- نقش کاربر -->
        <span class="inline-block px-4 py-1.5 rounded-full text-xs font-semibold mb-6" id="userRole">کاربر عادی</span>
        
        <div class="border-t border-gray-200 my-5"></div>
        
        <!-- اطلاعات کاربر -->
        <div class="flex justify-between py-2.5 border-b border-gray-100 text-sm">
            <span class="text-gray-400">👤 نام کاربری</span>
            <span class="text-gray-800 font-medium" id="userUsername">-</span>
        </div>
        <div class="flex justify-between py-2.5 border-b border-gray-100 text-sm">
            <span class="text-gray-400">📱 شماره تماس</span>
            <span class="text-gray-800 font-medium" id="userPhone">-</span>
        </div>
        
        <div class="border-t border-gray-200 my-5"></div>
        
        <!-- دکمه‌ها -->
        <div class="flex flex-col gap-3 mt-2">
            <a href="/tools/map" class="w-full py-3.5 bg-gradient-to-r from-teal-500 to-cyan-500 hover:from-teal-600 hover:to-cyan-600 text-white font-semibold rounded-xl transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5 text-center">
                🗺️ ورود به نقشه
            </a>
            <button onclick="window.logout()" class="btn-logout">🚪 خروج از حساب</button>
        </div>
        
        <div class="text-xs text-gray-400 mt-5">نسخه ۲.۰ | صدرافارس</div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/pages/dashboard.js?v={{ timestamp }}"></script>
{% endblock %}
