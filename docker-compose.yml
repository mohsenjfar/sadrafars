services:
  sadrafars:
    build:
      context: .
      dockerfile: Dockerfile
    image: sadrafars:latest
    container_name: sadrafars
    restart: unless-stopped
    networks:
      - external-net
    dns:
      - 217.218.127.127
      - 1.1.1.1
    ports:
      - "8000:8000"
    environment:
      - PB_URL=http://pocketbase:8090
      - PB_ADMIN_EMAIL=admin@example.com
      - PB_ADMIN_PASSWORD=password123
    depends_on:
      - pocketbase
  pocketbase:
    image: adrianmusante/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    volumes:
      - ./pb_data:/pb_data
      - ./pb_public:/pb_public
      - ./pb_hooks:/pb_hooks
    networks:
      - external-net
    working_dir: /pb_data
    environment:
      - PB_ENCRYPTION_KEY=xK9mP2vL5nQ8rT3yW6zA1bC4dE7fG0hJ
      - PB_ADMIN_EMAIL=ceo@aracom.ir
      - PB_ADMIN_PASSWORD=Mjf10505
      - PB_HTTP=0.0.0.0:8090

networks:
  external-net:
    external: true