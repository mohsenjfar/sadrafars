services:
  # سرویس اصلی صدرافارس (موجود)
  sadrafars:
    build:
      context: .
      dockerfile: Dockerfile
    image: sadrafars:latest
    container_name: sadrafars
    restart: unless-stopped
    networks:
      - external-net
    dns:
      - 217.218.127.127
      - 1.1.1.1
    ports:
      - "8000:8000"
    environment:
      - PB_URL=http://pocketbase:8090
      - PB_ADMIN_EMAIL=admin@example.com
      - PB_ADMIN_PASSWORD=password123
    depends_on:
      - pocketbase

  # سرویس PocketBase (جدید)
  pocketbase:
    image: adrianmusante/pocketbase:latest
    container_name: pocketbase
    restart: unless-stopped
    ports:
      - "8090:8090"  # پورت مدیریت PocketBase
    volumes:
      - ./pb_data:/pb_data      # داده‌های دیتابیس
      - ./pb_public:/pb_public  # فایل‌های عمومی
      - ./pb_hooks:/pb_hooks    # هوک‌های سفارشی (اختیاری)
    networks:
      - external-net
    working_dir: /pb_data
    environment:
      - PB_DATA_DIR=/pb_data
    command: serve --http=0.0.0.0:8090

networks:
  external-net:
    external: true