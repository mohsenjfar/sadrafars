name: Deploy sadrafars (Direct Clone)

on:
  push:
    branches:
      - main
      - development

jobs:
  deploy:
    runs-on: sadrafars
    steps:
      - name: Checkout repository
        shell: bash
        run: |
          set -e

          REPO_URL="ssh://git@87.248.139.251:2222/ARACOM/sadrafars.ir.git"
          BRANCH="${{ gitea.ref_name }}"

          rm -rf repo
          git clone --depth 1 --branch "$BRANCH" "$REPO_URL" repo

      - name: Deploy
        shell: bash
        run: |
          set -e

          BRANCH="${{ gitea.ref_name }}"
          
          cd repo

          if [ "$BRANCH" = "development" ]; then
            export COMPOSE_PROJECT_NAME="sadrafars-dev"
            
            echo "Deploying development app..."
            docker compose down || true
            docker compose up -d --build

            git clean -fdx || true

          elif [ "$BRANCH" = "main" ]; then
            export COMPOSE_PROJECT_NAME="sadrafars-prod"

            echo "Deploying production app..."
            docker compose down || true
            docker compose up -d --build

            git clean -fdx || true

          else
            echo "Unsupported branch: $BRANCH"
            exit 1
          fi
