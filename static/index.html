<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadrafars | سامانه خدمات مهندسی</title>
    
    <!-- تنظیم فاویکان -->
    <link rel="icon" type="image/jpeg" href="/static/favicon.jpeg">

    <!-- اضافه کردن فونت فارسی وزیر -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            
            background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), 
                        url("/static/bg.png") center/cover no-repeat fixed;
            color: white;
            overflow: hidden;
        }

        /* استایل لوگو در گوشه بالا سمت چپ */
        .header-logo {
            position: absolute;
            top: -40px;
            left: 20px; /* قرارگیری در سمت چپ طبق درخواست شما */
        }

        .header-logo img {
            height: 240px; /* اندازه لوگو را می‌توانید اینجا تغییر دهید */
            width: auto;
            display: block;
        }

        /* کادر شیشه‌ای مرکزی */
        .content-box {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 50px 70px;
            border-radius: 24px;
            text-align: center;
            max-width: 90%;
            width: 600px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 32px;
            margin: 0 0 35px 0;
            font-weight: 700;
            line-height: 1.8;
            color: #ffffff;
        }

        .cta {
            display: inline-block;
            padding: 14px 45px;
            background: #37c20d; /* رنگ سبز هماهنگ با لوگوی جدید شما */
            color: #ffffff;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
        }

        .cta:hover {
            background: #218838;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }

        /* بهینه‌سازی برای موبایل */
        @media (max-width: 600px) {
            .content-box { padding: 30px; }
            h1 { font-size: 24px; }
            .header-logo img { height: 45px; }
        }
    </style>
</head>
<body>

    <!-- لوگو در گوشه صفحه -->
    <div class="header-logo">
        <img src="/static/logo.png" alt="SadraFars Logo">
    </div>

    <!-- محتوای مرکزی -->
    <div class="content-box">
        <h1>سامانه جامع خدمات مهندسی شهر صدرا</h1>
        <a href="mailto:contact@sadrafars.ir" class="cta">تماس با ما</a>
    </div>

</body>
</html>
