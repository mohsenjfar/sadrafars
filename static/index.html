<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadrafars | سامانه خدمات مهندسی</title>

<link rel="icon" type="image/png" href="/static/favicon.png">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>

<style>

body{
font-family:'Vazirmatn',sans-serif;
margin:0;
padding:0;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
url("/static/bg.png") center/cover no-repeat fixed;
color:white;
}

.header-logo{
position:absolute;
top:-40px;
left:20px;
}

.header-logo img{
height:240px;
}

.content-box{
background:rgba(0,0,0,0.6);
backdrop-filter:blur(12px);
padding:50px 60px;
border-radius:24px;
text-align:center;
width:600px;
box-shadow:0 15px 35px rgba(0,0,0,0.5);
}

h1{
font-size:28px;
margin-bottom:30px;
}

select,input{
width:100%;
padding:14px;
border-radius:12px;
border:none;
font-size:16px;
margin-bottom:20px;
text-align:center;
}

button{
width:100%;
padding:14px;
background:#37c20d;
color:white;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#218838;
transform:translateY(-2px);
}

.result-box{
margin-top:25px;
padding:15px;
border-radius:12px;
background:rgba(255,255,255,0.1);
font-size:18px;
display:none;
}

.error{
background:rgba(255,0,0,0.2);
}

.loading{
opacity:0.6;
pointer-events:none;
}

@media(max-width:600px){
.content-box{padding:30px;width:90%;}
.header-logo img{height:60px;top:10px;}
}

</style>
</head>

<body>

<div class="header-logo">
<img src="/static/logo.png">
</div>

<div class="content-box">

<h1>محاسبه تعرفه خدمات نقشه برداری</h1>

<form id="calcForm">

<select id="serviceType" required>
<option value="">نوع درخواست را انتخاب کنید</option>
<option value="mesahi">مساحی</option>
<option value="piade">پیاده سازی</option>
</select>

<input
type="number"
id="area"
placeholder="متراژ ملک (متر مربع)"
min="1"
style="display:none"
>

<input
type="number"
id="points"
placeholder="تعداد نقاط"
min="1"
style="display:none"
>

<button type="submit">محاسبه تعرفه</button>

</form>

<div id="result" class="result-box"></div>

</div>

<script>

document.addEventListener("DOMContentLoaded",()=>{

const form=document.getElementById("calcForm")
const resultBox=document.getElementById("result")
const button=form.querySelector("button")

const serviceType=document.getElementById("serviceType")
const areaInput=document.getElementById("area")
const pointsInput=document.getElementById("points")

serviceType.addEventListener("change",()=>{

areaInput.style.display="none"
pointsInput.style.display="none"

if(serviceType.value==="mesahi"){
areaInput.style.display="block"
}

if(serviceType.value==="piade"){
pointsInput.style.display="block"
}

})

form.addEventListener("submit",async function(e){

e.preventDefault()

resultBox.style.display="none"

button.classList.add("loading")
button.innerText="در حال محاسبه..."

let url=""
let payload={}

try{

if(serviceType.value==="mesahi"){

url="/tariff/row/1-1"

payload={
area_m2:parseFloat(areaInput.value)
}

}

else if(serviceType.value==="piade"){

url="/tariff/row/piade"

payload={
points:parseInt(pointsInput.value)
}

}

const response=await fetch(url,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(payload)
})

if(!response.ok){
throw new Error("server error")
}

const data=await response.json()

resultBox.classList.remove("error")

resultBox.innerHTML=`
مبلغ قابل پرداخت:<br>
<strong style="font-size:22px;">
${Number(data.amount).toLocaleString()} ریال
</strong>
`

resultBox.style.display="block"

}catch(err){

resultBox.classList.add("error")
resultBox.innerText="خطا در ارتباط با سرور یا مقدار نامعتبر."
resultBox.style.display="block"

}

button.classList.remove("loading")
button.innerText="محاسبه تعرفه"

})

})

</script>

</body>
</html>
