<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Sadrafars</title>
    <!-- اضافه کردن فونت فارسی وزیر از CDN -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <style>
        body {
            /* استفاده از فونت Vazirmatn */
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* تنظیمات تصویر پس‌زمینه */
            background: linear-gradient(rgba(177, 173, 173, 0.4), rgba(0, 0, 0, 0.4)), url("./bg.png") center/cover no-repeat;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: white;
        }

        /* کادر شیشه‌ای پشت متن برای خوانایی بیشتر */
        .content-box {
            background: rgba(0, 0, 0, 0.6); /* کادر تیره نیمه‌شفاف */
            backdrop-filter: blur(8px); /* افکت تاری پشت کادر */
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 36px;
            margin: 0 0 30px 0;
            font-weight: 700;
            line-height: 1.6;
        }

        .cta {
            display: inline-block;
            padding: 12px 40px;
            background: #007bff;
            color: #ffffff;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s ease;
            font-size: 18px;
        }

        .cta:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="content-box">
        <h1>سامانه جامع خدمات مهندسی شهر صدرا</h1>
        <a href="mailto:contact@sadrafars.ir" class="cta">تماس با ما</a>
    </div>
</body>
</html>
