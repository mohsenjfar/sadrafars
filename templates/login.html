{% extends "layouts/base.html" %}

{% block title %}ورود به حساب کاربری{% endblock %}

{% block extra_css %}
<style>
.auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #f0fdfa 0%, #ecfeff 100%);
    padding: 20px;
}
.auth-card {
    background: white;
    border-radius: 24px;
    padding: 40px;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
}
.auth-card h1 {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
    color: #1e293b;
}
.auth-card .subtitle {
    text-align: center;
    color: #64748b;
    font-size: 14px;
    margin-bottom: 30px;
}
.form-group {
    margin-bottom: 20px;
}
.form-group label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: #334155;
    margin-bottom: 6px;
}
.form-group input {
    width: 100%;
    padding: 12px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 14px;
    transition: all 0.2s;
    background: #f8fafc;
}
.form-group input:focus {
    outline: none;
    border-color: #14b8a6;
    background: white;
    box-shadow: 0 0 0 4px rgba(20,184,166,0.1);
}
.btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #14b8a6, #06b6d4);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
}
.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(20,184,166,0.3);
}
.auth-footer {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
    color: #64748b;
}
.auth-footer a {
    color: #14b8a6;
    text-decoration: none;
    font-weight: 600;
}
.error-message {
    background: #fee2e2;
    color: #dc2626;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    margin-bottom: 20px;
    display: none;
}
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1>🔐 ورود</h1>
        <p class="subtitle">به سامانه جامع مهندسی ساختمان صدرافارس خوش آمدید</p>
        
        <div id="errorMessage" class="error-message"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" id="email" placeholder="example@email.com" required>
            </div>
            
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-primary">🚀 ورود به حساب</button>
        </form>
        
        <div class="auth-footer">
            حساب کاربری ندارید؟ <a href="/register">ثبت‌نام کنید</a>
        </div>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('errorMessage');
    
    try {
        const response = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
            localStorage.setItem('auth_token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            window.location.href = '/dashboard';
        } else {
            errorDiv.textContent = data.detail || 'خطا در ورود';
            errorDiv.style.display = 'block';
        }
    } catch (error) {
        errorDiv.textContent = 'خطا در ارتباط با سرور';
        errorDiv.style.display = 'block';
    }
});
</script>
{% endblock %}
