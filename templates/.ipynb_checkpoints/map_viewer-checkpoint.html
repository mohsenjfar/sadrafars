{% extends "layouts/base.html" %} {% block title %}نقشه قطعات - صدرافارس{%
endblock %} {% block extra_css %}
<link rel="stylesheet" href="/static/css/leaflet.css" />
<link rel="stylesheet" href="/static/css/tailwind.css?v={{ timestamp }}" />
<link rel="icon" type="image/png" href="/static/images/favicon.png" />
{% endblock %} {% block content %}

<header class="fixed top-0 left-0 right-0 z-50 bg-white/80 backdrop-blur-md border-b border-gray-200/50 shadow-sm">
  <nav class="flex flex-col sm:flex-row items-center justify-between max-w-7xl mx-auto px-4 py-2 sm:py-0 sm:h-[70px] gap-2 sm:gap-4">
    
    <div class="flex flex-col sm:flex-row items-center gap-2 w-full sm:w-auto order-1">
      <div class="relative w-full sm:w-56" id="districtDropdown">
        <input
          type="text"
          id="districtInput"
          class="w-full py-2 px-3.5 pr-14 border border-gray-200 rounded-lg text-sm bg-white/90 backdrop-blur-sm text-gray-800 transition-all duration-200 focus:outline-none focus:border-blue-600 focus:ring-3 focus:ring-blue-600/10 text-right cursor-pointer"
          placeholder="جستجوی ناحیه..."
          autocomplete="off"
        />
        <button
          type="button"
          class="absolute left-9 top-1/2 -translate-y-1/2 text-gray-400 text-base cursor-pointer transition-all duration-200 hover:text-red-500 hover:scale-110 hidden z-[5] bg-transparent border-none p-0.5 leading-none"
          id="districtClearBtn"
          title="پاک کردن"
        >
          ✕
        </button>
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px] transition-transform duration-200 z-[2]">▼</span>
        <div class="hidden absolute top-full left-0 right-0 mt-1 bg-white/95 backdrop-blur-sm border border-gray-200 rounded-lg max-h-[200px] overflow-y-auto z-[9999] shadow-md text-right" id="districtList"></div>
      </div>

      <div id="pieceSelectContainer" class="relative w-full sm:w-56 hidden">
        <input
          type="text"
          id="pieceInput"
          class="w-full py-2 px-3.5 pr-14 border border-gray-200 rounded-lg text-sm bg-white/90 backdrop-blur-sm text-gray-800 transition-all duration-200 focus:outline-none focus:border-blue-600 focus:ring-3 focus:ring-blue-600/10 text-right cursor-pointer"
          placeholder="جستجوی قطعه..."
          autocomplete="off"
        />
        <button
          type="button"
          class="absolute left-9 top-1/2 -translate-y-1/2 text-gray-400 text-base cursor-pointer transition-all duration-200 hover:text-red-500 hover:scale-110 hidden z-[5] bg-transparent border-none p-0.5 leading-none"
          id="pieceClearBtn"
          title="پاک کردن"
        >
          ✕
        </button>
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-[10px] transition-transform duration-200 z-[2]">▼</span>
        <div class="hidden absolute top-full left-0 right-0 mt-1 bg-white/95 backdrop-blur-sm border border-gray-200 rounded-lg max-h-[200px] overflow-y-auto z-[9999] shadow-md text-right" id="pieceList"></div>
      </div>
    </div>

    <a
      href="/"
      class="inline-flex items-center justify-center gap-1.5 px-5 py-2 rounded-lg bg-white/80 backdrop-blur-sm hover:bg-white/95 text-gray-700 text-xs font-medium transition-all duration-200 border border-gray-200/50 hover:border-gray-300 whitespace-nowrap w-full sm:w-auto order-2"
    >
      <span>←</span>
      بازگشت
    </a>
    
  </nav>
</header>

<div id="map" class="fixed top-0 left-0 right-0 bottom-0 w-full h-full bg-slate-100"></div>

<div id="loading" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-black/80 text-white py-3 px-6 rounded-xl z-[2000] text-sm font-vazir hidden items-center gap-3 shadow-lg">
  <svg class="animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
  </svg>
  <span>⏳ در حال بارگذاری...</span>
</div>

{% endblock %} {% block extra_js %}
<script src="/static/js/jquery.min.js"></script>
<script src="/static/js/leaflet.js"></script>
<script src="/static/js/map_viewer.js?v={{ timestamp }}"></script>
{% endblock %}
