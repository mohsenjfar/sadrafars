<!-- file_path: /templates/map_viewer.html -->

{% extends "layouts/base.html" %}

{% block title %}نقشه قطعات - صدرافارس{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
<link rel="stylesheet" href="/static/css/map_viewer.css?v={{ timestamp }}">
<link rel="icon" type="image/png" href="/static/images/favicon.png">
{% endblock %}

{% block content %}
<div class="map-header">
    <div class="search-wrapper">
        <select id="districtSelect" class="district-select" style="width: 250px;">
            <option value="">-- انتخاب ناحیه --</option>
        </select>
        
        <div id="pieceSelectContainer" style="display: none;">
            <select id="pieceSelect" class="piece-select" style="width: 250px;">
                <option value="">-- انتخاب قطعه --</option>
            </select>
        </div>
    </div>
    
    <a href="/" class="back-btn">← بازگشت</a>
</div>

<div class="map-container">
    <div id="map"></div>
    
    <div class="legend">
        <div><span style="background: #3b82f6;"></span> قطعات ناحیه</div>
        <div><span style="background: #ef4444;"></span> قطعه انتخاب شده</div>
    </div>
</div>

<!-- لودینگ -->
<div id="loading" class="loading" style="display: none;">⏳ در حال بارگذاری...</div>
{% endblock %}

{% block extra_js %}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script src="/static/js/map_viewer.js?v={{ timestamp }}"></script>
{% endblock %}
