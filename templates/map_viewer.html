<!-- file_path: /templates/map_viewer.html -->

{% extends "layouts/base.html" %}

{% block title %}نقشه قطعات - صدرافارس{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="/static/css/map_viewer.css?v={{ timestamp }}" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    'vazir': ['Vazirmatn', 'sans-serif'],
                }
            }
        }
    }
</script>
<link rel="icon" type="image/png" href="/static/images/favicon.png">
{% endblock %}

{% block content %}
<!-- ============================================================
     هدر
     ============================================================ -->
<header class="custom-header">
    <div class="flex flex-col sm:flex-row items-center justify-between gap-2 w-full max-w-7xl mx-auto">
        
        <div class="flex flex-col sm:flex-row items-center gap-2 w-full sm:w-auto">
            
            <!-- Dropdown ناحیه -->
            <div class="custom-dropdown w-full sm:w-56" id="districtDropdown">
                <input 
                    type="text" 
                    id="districtInput" 
                    class="custom-dropdown-input"
                    placeholder="جستجوی ناحیه..."
                    autocomplete="off"
                >
                <button type="button" class="custom-dropdown-clear" id="districtClearBtn" title="پاک کردن">✕</button>
                <span class="custom-dropdown-arrow">▼</span>
                <div class="custom-dropdown-list" id="districtList"></div>
            </div>
            
            <!-- Dropdown قطعه -->
            <div id="pieceSelectContainer" class="custom-dropdown w-full sm:w-56 hidden">
                <input 
                    type="text" 
                    id="pieceInput" 
                    class="custom-dropdown-input"
                    placeholder="جستجوی قطعه..."
                    autocomplete="off"
                >
                <button type="button" class="custom-dropdown-clear" id="pieceClearBtn" title="پاک کردن">✕</button>
                <span class="custom-dropdown-arrow">▼</span>
                <div class="custom-dropdown-list" id="pieceList"></div>
            </div>
        </div>
        
        <!-- دکمه بازگشت -->
        <a href="/" class="inline-flex items-center gap-1.5 px-5 py-2 rounded-lg bg-gray-100/80 hover:bg-gray-200/80 text-gray-700 text-xs font-medium transition-all duration-200 border border-gray-200/50 hover:border-gray-300 whitespace-nowrap">
            <span>←</span>
            بازگشت
        </a>
    </div>
</header>

<!-- ============================================================
     نقشه
     ============================================================ -->
<div class="map-wrapper">
    <div id="map"></div>
</div>

<!-- ============================================================
     لودینگ
     ============================================================ -->
<div id="loading" class="custom-loading">
    <svg class="spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
    </svg>
    <span>⏳ در حال بارگذاری...</span>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/static/js/map_viewer.js?v={{ timestamp }}"></script>
{% endblock %}
