{% extends "layouts/base.html" %}

{% block title %}داشبورد کاربری{% endblock %}

{% block extra_css %}
<style>
    .dashboard-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f0fdfa 0%, #ecfeff 100%);
        padding: 20px;
    }
    
    .dashboard-card {
        background: white;
        border-radius: 24px;
        padding: 50px 40px;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0,0,0,0.08);
        text-align: center;
    }
    
    .dashboard-card .avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #14b8a6, #06b6d4);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: white;
        margin: 0 auto 20px;
        font-weight: 700;
    }
    
    .dashboard-card h1 {
        font-size: 24px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 5px;
    }
    
    .dashboard-card .subtitle {
        color: #64748b;
        font-size: 14px;
        margin-bottom: 30px;
    }
    
    .dashboard-card .role-badge {
        display: inline-block;
        padding: 4px 16px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 25px;
    }
    
    .role-badge.engineer {
        background: #dcfce7;
        color: #166534;
    }
    
    .role-badge.user {
        background: #dbeafe;
        color: #1e40af;
    }
    
    .role-badge.admin {
        background: #fef3c7;
        color: #92400e;
    }
    
    .dashboard-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
    }
    
    .btn-map {
        padding: 14px;
        background: linear-gradient(135deg, #14b8a6, #06b6d4);
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .btn-map:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(20,184,166,0.3);
    }
    
    .btn-logout {
        padding: 14px;
        background: #fee2e2;
        color: #dc2626;
        border: 2px solid #fca5a5;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    
    .btn-logout:hover {
        background: #fecaca;
        transform: translateY(-2px);
    }
    
    .user-info-row {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #f1f5f9;
        font-size: 14px;
    }
    
    .user-info-row .label {
        color: #94a3b8;
    }
    
    .user-info-row .value {
        color: #0f172a;
        font-weight: 500;
    }
    
    .divider {
        border-top: 1px solid #e2e8f0;
        margin: 20px 0;
    }
    
    .error-message {
        background: #fee2e2;
        color: #dc2626;
        padding: 12px;
        border-radius: 10px;
        font-size: 14px;
        margin-bottom: 20px;
        display: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="dashboard-container">
    <div class="dashboard-card">
        <div class="avatar" id="userAvatar">👤</div>
        
        <h1 id="userName">کاربر</h1>
        <p class="subtitle" id="userEmail">example@email.com</p>
        
        <span class="role-badge" id="userRole">کاربر عادی</span>
        
        <div class="divider"></div>
        
        <div class="user-info-row">
            <span class="label">👤 نام کاربری</span>
            <span class="value" id="userUsername">-</span>
        </div>
        
        <div class="user-info-row">
            <span class="label">📱 شماره تماس</span>
            <span class="value" id="userPhone">-</span>
        </div>
        
        <div class="divider"></div>
        
        <div id="errorMessage" class="error-message"></div>
        
        <div class="dashboard-actions">
            <a href="/map" class="btn-map">
                🗺️ ورود به نقشه
            </a>
            <button onclick="logout()" class="btn-logout">
                🚪 خروج از حساب
            </button>
        </div>
        
        <div style="margin-top: 20px; font-size: 12px; color: #94a3b8;">
            نسخه ۲.۰ | صدرافارس
        </div>
    </div>
</div>

<script>
// ============================================================
// دریافت اطلاعات کاربر از localStorage
// ============================================================

function getUser() {
    try {
        const userData = localStorage.getItem('user');
        return userData ? JSON.parse(userData) : null;
    } catch {
        return null;
    }
}

function getToken() {
    return localStorage.getItem('auth_token');
}

// ============================================================
// نمایش اطلاعات کاربر در داشبورد
// ============================================================

function loadDashboard() {
    const token = getToken();
    const user = getUser();
    
    // اگر توکن یا کاربر وجود نداشت، به صفحه ورود برو
    if (!token || !user) {
        window.location.href = '/login';
        return;
    }
    
    // نمایش اطلاعات
    const fullName = user?.profile?.full_name || user?.username || 'کاربر';
    const email = user?.email || 'example@email.com';
    const username = user?.username || '-';
    const phone = user?.profile?.phone || '-';
    const role = user?.profile?.role || 'user';
    
    // حرف اول نام برای آواتار
    const firstChar = fullName.charAt(0) || '👤';
    document.getElementById('userAvatar').textContent = firstChar;
    
    document.getElementById('userName').textContent = fullName;
    document.getElementById('userEmail').textContent = email;
    document.getElementById('userUsername').textContent = username;
    document.getElementById('userPhone').textContent = phone;
    
    // تنظیم نقش
    const roleBadge = document.getElementById('userRole');
    if (role === 'engineer') {
        roleBadge.textContent = '🔧 نقشه‌بردار';
        roleBadge.className = 'role-badge engineer';
    } else if (role === 'admin') {
        roleBadge.textContent = '⚙️ مدیر سیستم';
        roleBadge.className = 'role-badge admin';
    } else {
        roleBadge.textContent = '👤 کاربر عادی';
        roleBadge.className = 'role-badge user';
    }
}

// ============================================================
// خروج از حساب
// ============================================================

function logout() {
    // حذف اطلاعات از localStorage
    localStorage.removeItem('auth_token');
    localStorage.removeItem('user');
    
    // رفتن به صفحه ورود
    window.location.href = '/login';
}

// ============================================================
// بارگذاری صفحه
// ============================================================

document.addEventListener('DOMContentLoaded', function() {
    loadDashboard();
});

console.log('✅ Dashboard loaded');
</script>
{% endblock %}
