<!-- file_path: /templates/layouts/_map_header.html -->

{% block map_header %}
<div class="flex items-center justify-between bg-white/80 backdrop-blur-sm px-6 py-3 border-b border-gray-200/50 shadow-sm">
    <h1 class="text-xl font-bold text-gray-800 flex items-center gap-2">
        <span class="text-2xl">🗺️</span>
        نقشه قطعات شهر صدرا
    </h1>
    
    <div class="relative flex items-center gap-2">
        <div class="relative">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="جستجوی شماره قطعه..." 
                autocomplete="off"
                class="w-64 px-4 py-2 pr-10 rounded-lg border border-gray-200 bg-white/90 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all duration-200 text-sm placeholder:text-gray-400"
            >
            <span class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</span>
        </div>
        <button 
            onclick="searchPiece()" 
            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition-all duration-200 shadow-sm hover:shadow-md"
        >
            جستجو
        </button>
        <div id="suggestions" class="suggestion-list absolute top-full right-0 left-0 mt-1 bg-white border border-gray-200 rounded-lg shadow-lg z-50 hidden max-h-60 overflow-y-auto"></div>
    </div>
    
    <a href="/" class="flex items-center gap-1.5 px-4 py-2 rounded-lg bg-gray-100/80 hover:bg-gray-200/80 text-gray-700 text-sm font-medium transition-all duration-200 border border-gray-200/50 hover:border-gray-300">
        <span>←</span>
        بازگشت
    </a>
</div>
{% endblock %}
