<!-- file_path: /templates/layouts/_map_info_panel.html -->

{% block map_info_panel %}
<div id="infoPanel" class="hidden fixed bottom-24 right-6 bg-white/95 backdrop-blur-sm rounded-xl shadow-lg border border-gray-200/50 p-5 w-72 z-[1000]">
    <h4 class="text-base font-bold text-gray-800 mb-3 flex items-center gap-2">
        <span>📍</span>
        اطلاعات قطعه
    </h4>
    <div class="space-y-2 text-sm">
        <p class="flex justify-between border-b border-gray-100 pb-1.5">
            <strong class="text-gray-600">شماره قطعه:</strong>
            <span id="infoPieceNum" class="text-gray-800 font-medium">-</span>
        </p>
        <p class="flex justify-between border-b border-gray-100 pb-1.5">
            <strong class="text-gray-600">نام کامل:</strong>
            <span id="infoFullName" class="text-gray-800 font-medium">-</span>
        </p>
        <p class="flex justify-between">
            <strong class="text-gray-600">مختصات:</strong>
            <span id="infoCoords" class="text-gray-800 font-mono text-xs">-</span>
        </p>
    </div>
</div>
{% endblock %}
